name: Rappel quotidien
on:
  schedule:
    # Plusieurs créneaux décalés : GitHub saute souvent les crons « pile à l'heure ».
    # Le script envoie au plus 1 rappel / 50 min, entre 8h et 22h heure de Paris.
    - cron: "7,23,41,53 5-21 * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Envoyer même hors plage / délai", type: boolean, default: false }
jobs:
  remind:
