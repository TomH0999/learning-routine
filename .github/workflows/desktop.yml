name: Installeur PC
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Copier l'app web
        shell: bash
        run: mkdir -p desktop/app && cp index.html app.js skip.js config.js style.css manifest.json icon.png desktop/app/
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: installeur-windows, path: desktop/dist/*.exe }
      - id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Routine d'apprentissage v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: "Installeur Windows ci-dessous. iPhone : https://tomh0999.github.io/learning-routine/ (Partager → Sur l'écran d'accueil). Voir README."
          files: desktop/dist/*.exe
